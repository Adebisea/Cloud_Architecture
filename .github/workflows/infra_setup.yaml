name: Infra Setup CI/CD Pipeline

on:
  push:
    branches:
      - IAC
    paths:
      - 'Infra/**'
      - '.github/workflows/infra_setup.yaml'
  pull_request:
    branches:
      - IAC
    paths:
      - '.github/workflows/infra_setup.yaml'
      - 'Infra/**'
  workflow_dispatch: 

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  Infra-setup:
    name: set up infrastructure on aws
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Infra
    steps:
      - name: checkout code from repo
        uses: actions/checkout@v4
        with: 
          sparse-checkout: Infra


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.REGION }}

      - name: setup terraform backend to store statefile
        shell: bash
        run: |
              echo "Creating S3 bucket if it doesn't exist..."
              set -e

              OUTPUT=$(aws s3api create-bucket --bucket tf-state-microservices-app-deploy --create-bucket-configuration LocationConstraint=${{ secrets.REGION }} 2>&1) && exit 0

              if echo "$OUTPUT" | grep -q 'BucketAlreadyOwnedByYou'; then
                echo "Bucket already exists in this account — continuing."
              else
                echo "Failed to create bucket: $OUTPUT"
                exit 1
              fi

      - name: Setup Terraform on the runner
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false -upgrade

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ env.tf_actions_working_dir }}\`, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
            
      - name: Terraform Apply     
        run: terraform apply -auto-approve -input=false
        