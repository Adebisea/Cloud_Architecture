
---
- name: Deploy app via SSM
  hosts: all
  gather_facts: no
  become: yes

  vars:
    ansible_connection: aws_ssm
    ansible_aws_ssm_region: eu-west-1
    ansible_aws_ssm_bucket_name: technn-deployment-bucket

    app_dir: /var/www/app
    log_dir: /var/log/myapp

  tasks:
    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Download app artifact
      amazon.aws.s3_object:
        bucket: technn-deployment-bucket
        object: app.zip
        dest: "{{ app_dir }}/app.zip"
        mode: get

    - name: Install unzip
      package:
        name: unzip
        state: present

    - name: Extract app
      unarchive:
        src: "{{ app_dir }}/app.zip"
        dest: "{{ app_dir }}"
        remote_src: yes

    - name: Remove zip
      file:
        path: "{{ app_dir }}/app.zip"
        state: absent

    - name: move nginx config
      copy:
        src: "{{ app_dir }}/nginx.config"
        dest: /etc/nginx/sites-available/myapp.conf
        remote_src: yes

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/myapp.conf
        dest: /etc/nginx/sites-enabled/myapp.conf
        state: link
        force: yes

    - name: Remove nginx default conf
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
        
    - name: Reload nginx
      systemd:
        name: nginx
        state: reloaded

    - name: Ensure log directory exists
      file:
        path: "{{ log_dir }}"
        state: directory

    - name: Create systemd service for Flask app
      copy:
        dest: /etc/systemd/system/myapp.service
        content: |
          [Unit]
          Description=My Flask App
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory={{ app_dir }}
          ExecStart=/opt/technn-venv/bin/python {{ app_dir }}/app.py
          Restart=always
          StandardOutput=file:{{ log_dir }}/app_output.log
          StandardError=file:{{ log_dir }}/app_error.log

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start myapp service
      systemd:
        name: myapp
        enabled: yes
        state: started

        

